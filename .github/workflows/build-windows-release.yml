name: Build Windows exe and publish Release

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build-windows:
    name: Build Windows exe and publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 'latest'

      - name: Verify pnpm
        run: pnpm --version

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build:web

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Tauri (Windows)
        env:
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Discover bundle files
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.zip' -o -iname '*.nsis.zip' -o -iname '*.tar.gz' \) -print | while IFS= read -r file; do
            cp "$file" release-artifacts/
          done

          echo "files_found=$(find release-artifacts -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          find release-artifacts -maxdepth 1 -type f -print

      - name: Publish release
        if: steps.bundle.outputs.files_found != '0'
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}-${{ github.run_id }}
          name: Build ${{ github.run_number }}
          body: Automated Windows build produced by workflow ${{ github.workflow }}
          artifacts: release-artifacts/*
          allowUpdates: true
          removeArtifacts: false

      - name: No bundle warning
        if: steps.bundle.outputs.files_found == '0'
        run: |
          echo "No bundle files were generated under src-tauri/target."
          echo "Check the Tauri build logs above for packaging errors."
          exit 1
